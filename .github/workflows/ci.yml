name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Bir surumun kirilmasi digerlerinin sonucunu gizlemesin: bos govde
      # tespiti derlenmis kod sekline bagli oldugu icin hatalar surume ve
      # yorumlayiciya ozgu olabiliyor.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10", "pypy3.11"]
        exclude:
          - {os: windows-latest, python-version: "pypy3.10"}
          - {os: windows-latest, python-version: "pypy3.11"}

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bagimliliklari kur
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Testler
        run: python -m pytest -q

      - name: Kalibre edilen bos govde imzalarini raporla
        shell: bash
        run: |
          python -c "import platform, sys, strict_interface._core as c; \
          print(platform.python_implementation(), sys.version); \
          print('kalibre edilen govde imzasi:', len(c._STUB_SHAPES))"

      - name: Ornekler calisiyor mu
        run: |
          python example.py
          python example2.py

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy strict_interface interface_contract typing_tests/valid.py

      - name: mypy eksik implementasyonu reddediyor mu
        shell: bash
        run: |
          if python -m mypy typing_tests/incomplete.py > mypy-output.txt 2>&1; then
            cat mypy-output.txt
            echo "Eksik implementasyon beklenmedik bicimde kabul edildi."
            exit 1
          fi
          cat mypy-output.txt
          grep -q 'Cannot instantiate abstract class' mypy-output.txt

  build:
    name: paket kurulabiliyor mu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Wheel ve sdist uret
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Meta veriyi dogrula
        run: python -m twine check dist/*

      - name: Paketler ve py.typed wheel icinde mi
        run: >-
          python -c "import zipfile, glob;
          w = glob.glob('dist/*.whl')[0];
          names = zipfile.ZipFile(w).namelist();
          expected = {'interface_contract/__init__.py', 'interface_contract/py.typed',
          'strict_interface/__init__.py', 'strict_interface/py.typed'};
          assert expected <= set(names), sorted(expected - set(names));
          print('iki import paketi ve py.typed dosyalari wheel icinde')"
