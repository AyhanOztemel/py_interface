[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-contract"
version = "0.4.0"
description = "Definition-time Python interface contracts with signature-aware runtime validation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayhan Öztemel" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["interface", "protocol", "abc", "contract", "runtime", "type-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AyhanOztemel/py_interface"
Repository = "https://github.com/AyhanOztemel/py_interface"
Issues = "https://github.com/AyhanOztemel/py_interface/issues"
Changelog = "https://github.com/AyhanOztemel/py_interface/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Test-only, deliberately free of anything that needs a compiler: mypy 2.x pulls
# in ast-serialize (PyO3), which requires 3.11+ and cannot build on PyPy 3.10.
# typeguard is here because the CI examples import it.
test = ["pytest>=7", "typeguard>=4"]
# Lint tools are pinned so a new release cannot turn CI red on its own.
dev = ["pytest>=7", "typeguard>=4", "mypy==2.3.1", "ruff==0.16.5"]

[tool.setuptools.packages.find]
include = ["interface_contract*", "strict_interface*"]

[tool.setuptools.package-data]
strict_interface = ["py.typed"]
interface_contract = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
strict = true
plugins = ["interface_contract.mypy_plugin"]
# Arayuz govdeleri kasitli olarak bostur.
disable_error_code = ["empty-body"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Testler bos govde tespitini kaynak kodu olmadan dogrulamak zorunda; exec ve
# assert burada aracin kendisi.
"test_strict_interface.py" = ["S101", "S102"]
"test_interface_contract.py" = ["S101"]
# Ornek dosyalarin gruplanmis import yazimi kasitli ve sabit kalmali; ruff'in
# isort'u sarmalarken tek-satir-tek-isim bicimini dayatiyor.
"example.py" = ["I001"]
"example2.py" = ["I001"]
