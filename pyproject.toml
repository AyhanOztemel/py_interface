[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-interface"
version = "0.3.0"
description = "Java/C# tarzi arayuzler: imzayi da dogrulayan, sinif tanimlandigi anda hata veren, kaynak koda bagimli olmayan"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["interface", "protocol", "abc", "contract", "type-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.4", "typeguard>=4"]

[tool.setuptools.packages.find]
include = ["strict_interface*"]

[tool.setuptools.package-data]
strict_interface = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test_strict_interface.py"]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
strict = true
# Arayuz govdeleri kasitli olarak bostur.
disable_error_code = ["empty-body"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Testler bos govde tespitini kaynak kodu olmadan dogrulamak zorunda; exec ve
# assert burada aracin kendisi.
"test_strict_interface.py" = ["S101", "S102"]
# Ornek dosyalarin gruplanmis import yazimi kasitli ve sabit kalmali; ruff'in
# isort'u sarmalarken tek-satir-tek-isim bicimini dayatiyor.
"example.py" = ["I001"]
"example2.py" = ["I001"]
